spring.application.name=smartdent-backend

# Conexion local con MariaDB/MySQL de XAMPP.
# En otros equipos, define estas variables de entorno sin guardar secretos en Git.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/smartdent_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.community.dialect.MariaDBLegacyDialect}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-response=true

# Documentacion interactiva de la API.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.api-docs.path=/v3/api-docs

# JWT local. En despliegue se debe definir JWT_SECRET como variable de entorno.
jwt.secret=${JWT_SECRET:SmartDentLocalDevelopmentSecretKey2026MustChange123456}
jwt.issuer=smartdent-backend
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}

# Orígenes separados por coma. En Render se define CORS_ALLOWED_ORIGINS con la URL pública del frontend.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
