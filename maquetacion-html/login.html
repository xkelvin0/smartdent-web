<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDent | Inicio de sesion</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth.js" defer></script>
</head>
<body class="login-page">
  <main class="auth-page">
    <section class="auth-card login-card" aria-labelledby="login-title">
      <header class="auth-header">
        <h1 id="login-title">SmartDent</h1>
        <p>Excelencia Clinica a traves de la Sofisticacion.</p>
      </header>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field-group">
          <label for="loginEmail">Correo Electronico</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M4 6h16v12H4z"></path>
                <path d="m4 7 8 6 8-6"></path>
              </svg>
            </span>
            <input id="loginEmail" name="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>
          </div>
          <small class="field-error" data-error-for="loginEmail"></small>
        </div>

        <div class="field-group">
          <div class="label-line">
            <label for="loginPassword">Contrasena</label>
            <a href="#" aria-label="Recuperar contrasena">Olvidaste tu contrasena?</a>
          </div>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              </svg>
            </span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="********" required>
            <button type="button" class="icon-button" data-toggle-password="loginPassword" aria-label="Mostrar contrasena">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <small class="field-error" data-error-for="loginPassword"></small>
        </div>

        <button class="primary-button" type="submit">Iniciar Sesion</button>
        <p class="form-feedback" id="loginFeedback" role="status" aria-live="polite"></p>
      </form>

      <div class="divider">
        <span>Eres nuevo paciente?</span>
      </div>

      <a class="link-button" href="registro.html">Crear una cuenta -></a>
    </section>

    <p class="secure-note">Acceso seguro y encriptado</p>
  </main>
</body>
</html>
