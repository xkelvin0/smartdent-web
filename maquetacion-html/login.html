<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de sesión de pacientes y administradores de SmartDent">
  <title>Iniciar sesión | SmartDent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
      <header class="auth-header">
        <h1 id="login-title">SmartDent</h1>
        <p>Excelencia Clínica a través de la Sofisticación.</p>
      </header>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 6h16v12H4zM4 7l8 6 8-6"/>
            </svg>
            <input id="email" name="email" type="email" autocomplete="email"
                   placeholder="tu@correo.com" aria-describedby="email-error" required>
          </div>
          <small id="email-error" class="field-error" aria-live="polite"></small>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Contraseña</label>
            <a id="forgot-password-link" href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-wrapper">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="11" rx="2"/>
              <path d="M8 10V7a4 4 0 018 0v3M12 14v3"/>
            </svg>
            <input id="password" name="password" type="password" minlength="8"
                   autocomplete="current-password" placeholder="••••••••"
                   aria-describedby="password-error" required>
            <button class="password-toggle" type="button" data-password-toggle="password"
                    aria-label="Mostrar contraseña" aria-pressed="false">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>
            </button>
          </div>
          <small id="password-error" class="field-error" aria-live="polite"></small>
        </div>

        <p id="login-message" class="form-message" aria-live="polite"></p>
        <button class="primary-button" type="submit">Iniciar Sesión</button>
      </form>

      <div class="register-separator"><span>¿Eres nuevo paciente?</span></div>
      <a class="register-link" href="registro.html">
        Crear una cuenta
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M5 12h14M14 7l5 5-5 5"/>
        </svg>
      </a>
    </section>

    <p class="security-note">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M12 3l7 3v5c0 4.5-2.8 8-7 10-4.2-2-7-5.5-7-10V6zM9 12l2 2 4-4"/>
      </svg>
      Acceso seguro y encriptado
    </p>
  </main>
</body>
</html>
